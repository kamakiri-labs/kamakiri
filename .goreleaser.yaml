version: 2

project_name: kamakiri

builds:
  - main: ./cmd/kamakiri
    binary: kamakiri
    env:
      - CGO_ENABLED=0
    # The tag is stamped as-is, leading "v" kept: that is the form the version
    # command reports. The kept "v" is a display form only, since the CLI drops
    # it itself when it builds the version token it states on the wire.
    # "-s -w" drops the symbol table and DWARF, which nothing here reads, and
    # takes a useful bite out of the download.
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

# Raw per-target binaries, no tar.gz or zip: a download is one file that runs
# as-is, and every consumer of these assets is spared an unpack step.
# goreleaser appends ".exe" to the two Windows names on its own.
archives:
  - formats: [binary]
    name_template: "kamakiri-{{ .Os }}-{{ .Arch }}"

# Named explicitly: the default embeds the project and version, so the file to
# fetch would be named differently at every release.
checksum:
  name_template: checksums.txt

# The commit history here carries no per-change detail, so a generated
# changelog would say nothing a reader wants. The notes are written by hand.
changelog:
  disable: true

# The Homebrew cask goreleaser writes for the tap. This config only authors the
# file: it pushes nothing, so the cask lands in dist/ and travels with it to the
# release workflow's homebrew job, which is what pushes it to the tap. That is
# also why no tap credential is configured here: with nothing in this file
# pushing, a token would be dead config and one more place a credential could
# sit. The repository is still named because an unnamed one makes the pipe skip
# and write no file at all. "true" is quoted because the field is a template
# string compared against that word, not a boolean.
homebrew_casks:
  - repository:
      owner: kamakiri-labs
      name: homebrew-tap
    skip_upload: "true"
    homepage: https://github.com/kamakiri-labs/kamakiri
    description: CLI for Kamakiri Pages
    # macOS marks what a cask downloads as quarantined, and these binaries are
    # unsigned, so without this a fresh install refuses to run until the user
    # clears the attribute by hand. The hook clears the whole staged directory
    # rather than naming the file inside it because the staged file's name is
    # per-architecture (kamakiri-darwin-arm64 and its siblings), and "-dr" is
    # recursive.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end

release:
  name_template: "{{ .Tag }}"
  # A tag such as v0.1.1-rc1 matches the same trigger as a plain release tag,
  # so mark any tag carrying a semver prerelease suffix as a GitHub
  # prerelease instead of publishing it as latest. Plain tags are unaffected.
  prerelease: auto
  # Release notes are hand-written and travel in the annotated tag's message.
  # .TagBody is the message minus its subject line, which the title above
  # already carries. Two consequences: the tag must be annotated (on a
  # lightweight tag this silently resolves to the pointed-at commit's message)
  # and its message must have a blank line after the subject (a one-line
  # message yields an empty body, also silently).
  header: "{{ .TagBody }}"
